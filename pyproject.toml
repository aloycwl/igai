[project]
name = "igai"
version = "0.1.0"
description = "Health data normalization, embedding, vector upsert, and report utilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111.0",
  "pandas>=2.2.0",
  "sqlalchemy>=2.0.0",
  "qdrant-client>=1.9.0",
  "matplotlib>=3.8.0",
  "psycopg2-binary>=2.9.0",
  "python-dotenv>=1.0.0"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
